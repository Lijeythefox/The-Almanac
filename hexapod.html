<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hexapod Build Guide</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Kalam:wght@300;400;700&family=Special+Elite&family=Reenie+Beanie&display=swap">
<style>
/* Layout: the 3D model sits on the dark leather desk (left), the journal page with the current step is pinned beside it (right); stacks on phones. Single journal look on purpose, matching The Almanac. */
:root{
  color-scheme:light;
  --desk:#2a1a12; --desk-2:#3b2519; --leather:#5a3420; --stitch:#c9a46a;
  --paper:#e9dbb8; --paper-edge:#c9b083; --ink:#2b1d12; --ink-soft:#5b4630; --sepia:#7a4b22; --red:#9b2a1c; --blue:#2c3f63;
  --tape:rgba(232,220,170,.72); --card:#f2ead2;
  --fell:"IM Fell English",Georgia,serif; --fellsc:"IM Fell English SC",Georgia,serif;
  --hand:"Kalam","Segoe Print",cursive; --scrawl:"Reenie Beanie","Segoe Print",cursive; --type:"Special Elite","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(ellipse at 20% 10%,rgba(255,200,140,.08),transparent 55%),repeating-linear-gradient(92deg,rgba(0,0,0,.06) 0 3px,transparent 3px 11px),linear-gradient(180deg,var(--desk-2),var(--desk));
  background-color:var(--desk);color:var(--ink);font-family:var(--hand);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:1320px;margin:0 auto;display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:6px 20px;color:#e8d3a6}
header h1{margin:0;font-family:var(--fellsc);font-weight:400;font-size:clamp(1.9rem,5vw,3rem);line-height:1;color:#e9cf93;text-shadow:0 1px 0 rgba(0,0,0,.6)}
header p{margin:0;font-family:var(--type);font-size:.78rem;color:#cbb183}
header a{color:#e9cf93}
.main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:18px;align-items:start}
.stage{position:relative;height:min(78vh,760px);min-height:420px;border-radius:10px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 35%,#4a3020,#1d120c 75%);box-shadow:inset 0 0 0 6px rgba(0,0,0,.25),inset 0 0 60px rgba(0,0,0,.6),0 14px 30px -12px rgba(0,0,0,.7)}
.stage::after{content:"";position:absolute;inset:10px;border:2px dashed var(--stitch);border-radius:6px;opacity:.35;pointer-events:none}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;transform:translate(-50%,-100%);font-family:var(--type);font-size:.72rem;line-height:1.25;color:var(--ink);background:var(--card);
  padding:4px 8px;border-left:3px solid var(--blue);box-shadow:0 3px 8px rgba(0,0,0,.45);white-space:nowrap;margin-top:-10px;opacity:0;transition:opacity .4s}
.lab.o{border-left-color:var(--red)}
.lab.show{opacity:1}
.prog{position:absolute;left:0;bottom:0;height:3px;background:var(--stitch);opacity:.7;width:0}
.lab::after{content:"";position:absolute;left:50%;bottom:-8px;width:1px;height:8px;background:var(--card)}
.hint{position:absolute;left:18px;bottom:14px;font-family:var(--type);font-size:.68rem;color:#cbb183;opacity:.8}
.loading{position:absolute;inset:0;display:grid;place-content:center;font-family:var(--fell);font-style:italic;font-size:1.3rem;color:#e9cf93;text-align:center}
.tools{position:absolute;right:16px;top:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:end}
.tools button{font-family:var(--type);font-size:.72rem;color:#e9cf93;background:rgba(0,0,0,.35);border:1px solid rgba(201,164,106,.45);border-radius:999px;padding:5px 11px;cursor:pointer}
.tools button[aria-pressed="true"]{background:rgba(201,164,106,.3)}
.page{position:relative;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(110,70,25,.35) 100%),var(--paper);background-color:var(--paper);
  border-radius:3px 10px 10px 3px;padding:24px 24px 22px 34px;box-shadow:-6px 0 0 -2px var(--paper-edge),-11px 0 0 -4px #b89c6c,0 20px 40px -18px rgba(0,0,0,.85),inset 0 0 50px rgba(90,55,15,.22);
  min-height:420px;display:flex;flex-direction:column}
.page::before{content:"";position:absolute;left:18px;top:0;bottom:0;width:1px;background:rgba(155,42,28,.35)}
.stepno{font-family:var(--type);font-size:.78rem;color:var(--ink-soft);display:flex;justify-content:space-between;gap:10px}
.page h2{font-family:var(--fellsc);font-weight:400;font-size:clamp(1.8rem,3.4vw,2.5rem);line-height:1;margin:8px 0 6px}
.need{background:var(--card);padding:12px 14px 8px;margin:14px 0 6px;position:relative;box-shadow:0 5px 12px -8px rgba(60,30,5,.7);transform:rotate(-.6deg)}
.need::before{content:"";position:absolute;top:-10px;left:16px;width:72px;height:20px;background:var(--tape);transform:rotate(-5deg)}
.need h3{margin:0 0 4px;font-family:var(--type);font-weight:400;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.need ul{margin:0;padding-left:18px;font-size:.95rem}
.need li::marker{content:"— ";color:var(--sepia)}
.body ol{padding-left:22px;margin:12px 0 0}
.body li{margin-bottom:7px}
.body li::marker{font-family:var(--fell);color:var(--sepia)}
.body b{color:var(--ink)}
.tip,.warn{margin:12px 0 0;padding:8px 12px;font-size:.95rem}
.tip{border-left:3px solid var(--blue);background:rgba(44,63,99,.08)}
.warn{border-left:3px solid var(--red);background:rgba(155,42,28,.08)}
.nav{margin-top:auto;padding-top:18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav button{font-family:var(--fell);font-size:1.05rem;color:#2a1a10;background:linear-gradient(#e9cf93,#c9a46a);border:none;border-radius:4px;padding:8px 16px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.nav button:disabled{opacity:.4;cursor:default}
.dots{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.dots button{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--sepia);background:transparent;padding:0;cursor:pointer}
.dots button.on{background:var(--red);border-color:var(--red)}
.dots button.done{background:var(--sepia)}
button:focus-visible{outline:2px dashed var(--red);outline-offset:3px}
.foot{font-family:var(--scrawl);font-size:1.4rem;color:var(--ink-soft);margin-top:10px}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}.stage{height:58vh;min-height:340px}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Hexapod · Build Guide</h1>
    <p>Entry X of <a href="index.html#e010">The Almanac</a> · drag to orbit · scroll to zoom · ← → to change step</p>
  </header>
  <div class="main">
    <div class="stage" id="stage">
      <div class="labels" id="labels"></div>
      <div class="prog" id="prog"></div>
      <div class="tools">
        <button type="button" id="play" aria-pressed="false">▶ play all</button>
        <button type="button" id="replay">↻ replay step</button>
        <button type="button" id="lbl" aria-pressed="true">labels</button>
      </div>
      <div class="hint">every part slides in where it goes · ▶ play all to watch the whole build</div>
      <div class="loading" id="loading">Unpacking the parts…</div>
    </div>
    <article class="page" aria-live="polite">
      <div class="stepno"><span id="sno">Step 1</span><span id="scount"></span></div>
      <h2 id="stitle">…</h2>
      <div class="need"><h3>You need</h3><ul id="sneed"></ul></div>
      <div class="body" id="sbody"></div>
      <div class="nav">
        <button type="button" id="prev">← Back</button>
        <div class="dots" id="dots"></div>
        <button type="button" id="next">Next →</button>
      </div>
      <div class="foot">— E.</div>
    </article>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script>
(function(){
  var stage=document.getElementById('stage'),labelsEl=document.getElementById('labels'),loading=document.getElementById('loading'),prog=document.getElementById('prog');
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!window.THREE){loading.textContent='3D engine could not load. Check your internet connection.';return;}
  var renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.outputEncoding=THREE.sRGBEncoding;
  stage.insertBefore(renderer.domElement,stage.firstChild);
  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(35,1,2,6000);
  camera.up.set(0,0,1);camera.position.set(900,-1100,700);
  var controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true;controls.dampingFactor=.08;controls.maxDistance=1800;controls.minDistance=40;
  controls.target.set(0,0,60);
  scene.add(new THREE.HemisphereLight(0xfff1dc,0x3b2519,.85));
  var sun=new THREE.DirectionalLight(0xffffff,.85);sun.position.set(300,-400,700);scene.add(sun);
  var fill=new THREE.DirectionalLight(0xffe2b8,.35);fill.position.set(-400,300,200);scene.add(fill);
  var floor=new THREE.Mesh(new THREE.CircleGeometry(900,64),new THREE.MeshStandardMaterial({color:0x4a3020,roughness:.95}));
  floor.position.set(0,-120,0);scene.add(floor);
  var grid=new THREE.PolarGridHelper(880,16,10,64,0x7a5232,0x5c3d25);grid.rotation.x=Math.PI/2;grid.position.set(0,-120,.3);scene.add(grid);

  function resize(){var w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
  window.addEventListener('resize',resize);resize();

  var G,items=[],labs=[],geos={},cur=-1,camAnim=null,showLabels=true,doneAt=0,stepStart=0,playing=false,nextAt=0;
  // smooth in-out curves
  var ease=function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
  var sine=function(t){return -(Math.cos(Math.PI*t)-1)/2;};

  fetch('hexapod/guide.json').then(function(r){return r.json();}).then(function(g){
    G=g;var loader=new THREE.STLLoader(),left=g.models.length;
    g.models.forEach(function(name){
      fetch('hexapod/models/'+name+'.stl').then(function(r){return r.arrayBuffer();}).then(function(buf){
        var geo=loader.parse(buf);geo.computeVertexNormals();geos[name]=geo;
        loading.textContent='Unpacking the parts… '+(g.models.length-(--left))+' / '+g.models.length;
        if(left===0)build();
      }).catch(function(){loading.textContent='Could not load '+name+'.stl';});
    });
  }).catch(function(){loading.textContent='Could not load the guide data.';});

  function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.6,metalness:/b9bcc2|d4a43a/.test(c)?.55:.05});}

  // every part / wire keeps its own progress value v (0 = not there, 1 = in place)
  function build(){
    loading.remove();
    G.inst.forEach(function(it,k){
      var m=new THREE.Mesh(geos[it.model],mat(it.color));
      m.matrixAutoUpdate=false;m.visible=false;scene.add(m);
      items.push({kind:'part',obj:m,step:it.step,d:it.d||0,frm:it.frm,base:new THREE.Matrix4().set.apply(new THREE.Matrix4(),it.m),
        drop:G.drop.indexOf(k)>=0,v:0,a:null,dv:0,da:null});
    });
    G.wires.forEach(function(w){
      var pts=w.pts.map(function(p){return new THREE.Vector3(p[0],p[1],p[2]);});
      var curve=new THREE.CatmullRomCurve3(pts,false,'catmullrom',.3);
      var geo=new THREE.TubeGeometry(curve,Math.max(24,pts.length*14),w.r,8,false);
      var m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:w.color,roughness:.45}));
      m.visible=false;scene.add(m);
      items.push({kind:'wire',obj:m,step:w.step,d:w.d||0,total:geo.index?geo.index.count:geo.attributes.position.count,v:0,a:null});
    });
    G.labels.forEach(function(l){
      var d=document.createElement('div');d.className='lab'+(l.c?' '+l.c:'');d.textContent=l.t;labelsEl.appendChild(d);
      labs.push({el:d,p:new THREE.Vector3(l.p[0],l.p[1],l.p[2]),step:l.step});
    });
    var dots=document.getElementById('dots');
    G.steps.forEach(function(s,i){var b=document.createElement('button');b.type='button';b.title=(i+1)+'. '+s.title;b.setAttribute('aria-label','Step '+(i+1)+': '+s.title);b.addEventListener('click',function(){go(i);});dots.appendChild(b);});
    var h=parseInt((location.hash.match(/step(\d+)/)||[])[1],10);
    go(h>0&&h<=G.steps.length?h-1:0);
  }

  var M=new THREE.Matrix4();
  function render(it){
    var m=it.obj;
    if(it.kind==='wire'){
      m.visible=it.v>0.002;
      var n=Math.floor(it.total*it.v/6)*6;m.geometry.setDrawRange(0,it.v>=1?Infinity:n);return;
    }
    m.visible=it.v>0.002;if(!m.visible)return;
    var o=1-it.v,dz=it.drop?G.drop_dz*it.dv:0;
    M.makeTranslation(it.frm[0]*o,it.frm[1]*o,it.frm[2]*o+dz);
    m.matrix.copy(M.multiply(it.base));m.matrixWorldNeedsUpdate=true;
    var op=Math.min(1,it.v*1.8),tr=op<.999;
    if(m.material.transparent!==tr){m.material.transparent=tr;m.material.needsUpdate=true;}
    m.material.opacity=op;
    var glow=it.a&&it.a.to===1?(1-it.v):0;
    m.material.emissive.setHex(0x5a3a10);m.material.emissiveIntensity=glow*.9;
  }

  // ---------------- camera: orbit along an arc around a gliding target
  function sph(p,t){var o=p.clone().sub(t);var r=o.length();return {r:r,az:Math.atan2(o.y,o.x),el:Math.asin(Math.max(-1,Math.min(1,o.z/r)))};}
  function camTo(c,now){
    var to={p:new THREE.Vector3(c.pos[0],c.pos[1],c.pos[2]),t:new THREE.Vector3(c.tgt[0],c.tgt[1],c.tgt[2])};
    var a=sph(camera.position,controls.target),b=sph(to.p,to.t);
    var daz=b.az-a.az;while(daz>Math.PI)daz-=2*Math.PI;while(daz<-Math.PI)daz+=2*Math.PI;
    var move=Math.abs(daz)+Math.abs(b.el-a.el)+Math.abs(Math.log(b.r/a.r))+controls.target.distanceTo(to.t)/300;
    var dur=reduce?0:Math.max(900,Math.min(2600,900+move*900));
    camAnim={a:a,b:b,daz:daz,t0:controls.target.clone(),t1:to.t,s:now,dur:dur};
    return dur;
  }
  function camStep(now){
    if(!camAnim)return;
    var t=camAnim.dur?Math.min(1,(now-camAnim.s)/camAnim.dur):1,e=sine(t),A=camAnim.a,B=camAnim.b;
    controls.target.lerpVectors(camAnim.t0,camAnim.t1,e);
    var r=A.r*Math.pow(B.r/A.r,e),az=A.az+camAnim.daz*e,el=A.el+(B.el-A.el)*e;
    // pull back a touch mid-flight so big moves read as one sweep
    r*=1+.12*Math.sin(Math.PI*e)*Math.min(1,Math.abs(camAnim.daz)+Math.abs(B.el-A.el));
    camera.position.set(controls.target.x+r*Math.cos(el)*Math.cos(az),controls.target.y+r*Math.cos(el)*Math.sin(az),controls.target.z+r*Math.sin(el));
    if(t>=1)camAnim=null;
  }
  controls.addEventListener('start',function(){camAnim=null;});

  function animate(it,key,to,start,dur){
    var from=key==='v'?it.v:it.dv;
    if(from===to){it[key==='v'?'a':'da']=null;return start;}
    it[key==='v'?'a':'da']={from:from,to:to,s:start,dur:reduce?1:dur*Math.abs(to-from)+1};
    return start+(reduce?1:dur*Math.abs(to-from));
  }

  function go(i){
    if(!G)return;i=Math.max(0,Math.min(G.steps.length-1,i));
    var now=performance.now(),fwd=i>=cur;
    var camDur=camTo(G.steps[i].cam,now);
    var lead=reduce?0:Math.min(camDur*.6,1100);
    var end=now+camDur;
    // parts that need to come in: in step order, then by their own delay
    var inc=items.filter(function(it){return it.step<=i&&(it.v<1||(it.a&&it.a.to!==1));});
    var out=items.filter(function(it){return it.step>i&&(it.v>0||(it.a&&it.a.to!==0));});
    var steps=[];inc.forEach(function(it){if(steps.indexOf(it.step)<0)steps.push(it.step);});steps.sort(function(a,b){return a-b;});
    var multi=steps.length>1;
    inc.forEach(function(it){
      var k=steps.indexOf(it.step),gap=multi?900:0;
      var st=now+lead+k*gap+it.d*(multi?500:900)+(it.kind==='wire'?250:0);
      end=Math.max(end,animate(it,'v',1,st,it.kind==='wire'?1300:1150));
    });
    var maxS=0;out.forEach(function(it){maxS=Math.max(maxS,it.step);});
    out.forEach(function(it){
      var st=now+(maxS-it.step)*250+(1.5-Math.min(1.5,it.d))*120;
      end=Math.max(end,animate(it,'v',0,st,700));
    });
    // the drop (body lowered onto its feet)
    items.forEach(function(it){if(!it.drop)return;var tgt=i>=G.drop_step?1:0;
      if(it.dv!==tgt||(it.da&&it.da.to!==tgt))end=Math.max(end,animate(it,'dv',tgt,now+lead+(fwd?600:0),1300));});
    cur=i;stepStart=now;doneAt=end;nextAt=0;
    labs.forEach(function(l){l.el.classList.remove('show');});
    var s=G.steps[i];
    document.getElementById('sno').textContent='Step '+(i+1);
    document.getElementById('scount').textContent=(i+1)+' / '+G.steps.length;
    document.getElementById('stitle').textContent=s.title;
    var ul=document.getElementById('sneed');ul.innerHTML='';
    s.need.forEach(function(n){var li=document.createElement('li');li.textContent=n;ul.appendChild(li);});
    document.getElementById('sbody').innerHTML=s.html;
    document.getElementById('prev').disabled=i===0;
    document.getElementById('next').disabled=i===G.steps.length-1;
    [].forEach.call(document.getElementById('dots').children,function(b,k){b.classList.toggle('on',k===i);b.classList.toggle('done',k<i);});
    try{history.replaceState(null,'','#step'+(i+1));}catch(e){}
  }

  function replay(){
    // slide this step's parts back out, then in again
    var now=performance.now();
    items.forEach(function(it){if(it.step===cur){it.v=0;it.a=null;render(it);}});
    var c=cur;cur=c;go(c);
  }
  function setPlay(on){playing=on;var b=document.getElementById('play');b.setAttribute('aria-pressed',on);b.textContent=on?'❚❚ pause':'▶ play all';nextAt=0;}

  document.getElementById('prev').addEventListener('click',function(){go(cur-1);});
  document.getElementById('next').addEventListener('click',function(){go(cur+1);});
  document.getElementById('replay').addEventListener('click',replay);
  document.getElementById('play').addEventListener('click',function(){
    if(playing){setPlay(false);return;}
    setPlay(true);if(cur===G.steps.length-1)go(0);
  });
  document.getElementById('lbl').addEventListener('click',function(){showLabels=!showLabels;this.setAttribute('aria-pressed',showLabels);});
  document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);if(e.key===' '&&e.target===document.body){e.preventDefault();document.getElementById('play').click();}});

  var v=new THREE.Vector3();
  function tick(now){
    requestAnimationFrame(tick);
    camStep(now);
    items.forEach(function(it){
      var changed=false;
      if(it.a){var t=(now-it.a.s)/it.a.dur;if(t>=0){t=Math.min(1,t);it.v=it.a.from+(it.a.to-it.a.from)*ease(t);if(t>=1){it.v=it.a.to;it.a=null;}changed=true;}}
      if(it.da){var t2=(now-it.da.s)/it.da.dur;if(t2>=0){t2=Math.min(1,t2);it.dv=it.da.from+(it.da.to-it.da.from)*ease(t2);if(t2>=1){it.dv=it.da.to;it.da=null;}changed=true;}}
      if(changed||it.dirty!==false){render(it);it.dirty=!!(it.a||it.da);}
    });
    controls.update();
    renderer.render(scene,camera);
    if(!G)return;
    var settled=!camAnim&&now>=doneAt;
    prog.style.width=(Math.min(1,(now-stepStart)/Math.max(1,doneAt-stepStart))*100)+'%';
    prog.style.opacity=settled?0:.7;
    if(playing&&settled){
      if(!nextAt)nextAt=now+3200;
      else if(now>=nextAt){if(cur<G.steps.length-1)go(cur+1);else setPlay(false);}
    }
    var w=stage.clientWidth,h=stage.clientHeight;
    labs.forEach(function(l){
      var on=showLabels&&l.step===cur&&settled;
      if(on){v.copy(l.p).project(camera);
        if(v.z>1||v.x<-1.1||v.x>1.1||v.y<-1.1||v.y>1.1)on=false;
        else{l.el.style.left=((v.x+1)/2*w)+'px';l.el.style.top=((1-v.y)/2*h)+'px';}}
      l.el.classList.toggle('show',on);
    });
  }
  requestAnimationFrame(tick);
})();
